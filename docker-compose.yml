services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: academic
      POSTGRES_PASSWORD: academic
      POSTGRES_DB: profstack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://academic:academic@db:5432/profstack
      APP_ENV: development
    depends_on:
      - db

volumes:
  pgdata:
